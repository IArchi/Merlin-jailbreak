[package]
name = "merlinjailbreak"
version = "0.3.0"
description = "Merlin Jailbreak pour ajouter/modifier et supprimer les histoires de la fabrique à histoires Merlin"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "merlinjailbreak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
id3 = "1.16"
