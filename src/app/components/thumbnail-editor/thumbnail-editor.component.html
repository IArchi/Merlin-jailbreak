<div 
  class="thumbnail-editor"
  [class.compact]="compact"
  [class.drag-over]="isDragOver()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  @if (isLoading()) {
    <div class="loading-state">
      <svg class="spinner" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10" stroke-dasharray="31.4" stroke-dashoffset="10"/>
      </svg>
    </div>
  } @else if (previewUrl) {
    <div class="image-preview" [class.is-clickable]="compact" (click)="onPreviewClick()">
      <img [src]="previewUrl" [alt]="alt" />
      <div class="image-overlay">
        @if (!hideEditAction) {
          <button class="btn btn-icon" (click)="onSelectImage(); $event.stopPropagation()" title="Modifier">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
        }
        <button class="btn btn-icon btn-danger" (click)="onRemoveImage(); $event.stopPropagation()" title="Supprimer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3,6 5,6 21,6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
      </div>
    </div>
  } @else {
    <div class="empty-state" [class.is-audio]="isAudio" [class.is-folder]="isFolder" (click)="onSelectImage()">
      <div class="empty-watermark" aria-hidden="true">
        @if (isAudio) {
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 18V5l10-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="16" cy="16" r="3"/>
          </svg>
        } @else {
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
        }
      </div>
      <div class="empty-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21,15 16,10 5,21"/>
        </svg>
      </div>
      <p class="empty-text">{{ compact ? 'Ajouter une vignette' : 'Cliquez ou déposez une image' }}</p>
      @if (!compact) {
        <p class="empty-hint">JPG, PNG ou BMP</p>
      }
    </div>
  }
</div>
