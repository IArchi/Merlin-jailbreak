<header class="header">
  <div class="header-left">
    <div class="logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="10,8 16,12 10,16" fill="currentColor"/>
      </svg>
      <span class="logo-text">Merlin JailBreak</span>
    </div>
  </div>

  <div class="header-center">
  </div>

  <div class="header-actions">
    @if (!playlistService.hierarchy()) {
      <button class="btn btn-primary" (click)="onCreatePlaylist()" title="Créer une playlist vide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <line x1="12" y1="10" x2="12" y2="16"/>
          <line x1="9" y1="13" x2="15" y2="13"/>
        </svg>
        <span>Nouvelle playlist</span>
      </button>
    }

    <button class="btn btn-ghost" (click)="onImport()" title="Ouvrir une playlist">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7,10 12,15 17,10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span>Ouvrir une playlist</span>
    </button>

    @if (playlistService.hierarchy()) {
      <button class="btn btn-primary" (click)="onExport()" title="Exporter">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17,8 12,3 7,8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>Exporter vers un dossier</span>
      </button>
    }
  </div>
</header>
