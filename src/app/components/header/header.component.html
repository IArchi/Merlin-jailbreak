<header class="header">
  <div class="header-left">
    <div class="logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="10,8 16,12 10,16" fill="currentColor"/>
      </svg>
      <span class="logo-text">Merlin JailBreak</span>
    </div>
  </div>

  <div class="header-center">
  </div>

  <div class="header-actions">
    @if (!playlistService.hierarchy()) {
      <button class="btn btn-primary" (click)="onCreatePlaylist()" title="Créer une playlist vide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <line x1="12" y1="10" x2="12" y2="16"/>
          <line x1="9" y1="13" x2="15" y2="13"/>
        </svg>
        <span>Nouvelle playlist</span>
      </button>
    }

    <button class="btn btn-ghost" (click)="onImport()" title="Ouvrir une playlist">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7,10 12,15 17,10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span>Ouvrir une playlist</span>
    </button>

    @if (playlistService.hierarchy()) {
      <button class="btn btn-ghost" (click)="onDebugPlaylist()" title="Afficher le debug playlist.bin">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18h6"/>
          <path d="M10 22h4"/>
          <path d="M12 2v8"/>
          <path d="M4.93 10.93l1.41 1.41"/>
          <path d="M17.66 12.34l1.41-1.41"/>
          <path d="M2 18h2"/>
          <path d="M20 18h2"/>
          <path d="M6 18a6 6 0 1 1 12 0c0 1.66-1.34 3-3 3H9c-1.66 0-3-1.34-3-3Z"/>
        </svg>
        <span>Debug</span>
      </button>

      <button class="btn btn-primary" (click)="onExport()" title="Exporter">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17,8 12,3 7,8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>Exporter vers un dossier</span>
      </button>
    }
  </div>
</header>

@if (debugDialogOpen()) {
  <div class="debug-overlay" (click)="closeDebugDialog()">
    <div class="debug-dialog" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="debug-playlist-title">
      <div class="debug-dialog-header">
        <h2 id="debug-playlist-title">Debug playlist.bin</h2>
        <button class="debug-close" type="button" (click)="closeDebugDialog()" aria-label="Fermer le debug playlist.bin">×</button>
      </div>

      <pre class="debug-dialog-content">{{ playlistService.exportDebugTreeText() }}</pre>
    </div>
  </div>
}
